# HTTP server - redirect all traffic to HTTPS
server {
    listen 80;
    server_name clinicaldan.ru www.clinicaldan.ru 194.58.90.133;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name clinicaldan.ru www.clinicaldan.ru 194.58.90.133;
    root /var/www/html;
    index index.html;

    # SSL certificates (укажите пути к вашим SSL сертификатам)
    ssl_certificate /etc/letsencrypt/live/clinicaldan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicaldan.ru/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Основные файлы
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy - все запросы к API перенаправляем на бэкенд
    location /api/ {
        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Статические ресурсы
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Документы
    location /documents/ {
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Изображения
    location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS и JS
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
