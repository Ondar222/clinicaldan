# Default server - catch all requests and redirect to Netlify
server {
    listen 80 default_server;
    server_name _;
    return 301 https://clinicaldan.ru$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/clinicaldan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicaldan.ru/privkey.pem;

    return 301 https://clinicaldan.ru$request_uri;
}

# HTTP server - redirect all traffic to HTTPS
server {
    listen 80;
    server_name clinicaldan.ru www.clinicaldan.ru 194.58.90.133;
    return 301 https://clinicaldan.ru$request_uri;
}

# HTTPS server - main site with backend proxy
server {
    listen 443 ssl http2;
    server_name clinicaldan.ru www.clinicaldan.ru 194.58.90.133;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/clinicaldan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicaldan.ru/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Backend API proxy - Archimed API
    location /api/ {
        proxy_pass http://localhost:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API proxy - VK Posts (with /api prefix from frontend)
    location /api/vk/ {
        proxy_pass http://localhost:5002/api/vk/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API proxy - VK Posts
    location /vk/ {
        proxy_pass http://localhost:5002/vk/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API proxy - Certificate
    location /certificate/ {
        proxy_pass http://localhost:5002/certificate/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API proxy - Certificate (via /api)
    location /api/certificate/ {
        proxy_pass http://localhost:5002/certificate/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API proxy - Health check
    location /health {
        proxy_pass http://localhost:5002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Main site - Netlify (fallback)
    location / {
        # Try local files first, then proxy to Netlify
        try_files $uri $uri/ @netlify;
    }

    location @netlify {
        return 301 https://clinicaldan.ru$request_uri;
    }
}
