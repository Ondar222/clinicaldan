<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сертификат оплачен — Клиника Алдан</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; background: #f9fafb; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { max-width: 420px; width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 2rem; text-align: center; }
    .icon { width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 50%; background: #dcfce7; color: #16a34a; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 36px; height: 36px; }
    h1 { font-size: 1.35rem; color: #111; margin: 0 0 0.5rem; }
    .sub { color: #6b7280; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .receipt { background: #f3f4f6; border-radius: 8px; padding: 1.25rem; text-align: left; margin-bottom: 1.5rem; border: 1px solid #e5e7eb; }
    .receipt h2 { font-size: 0.95rem; margin: 0 0 0.75rem; color: #374151; }
    .row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .row:last-child { margin-bottom: 0; }
    .row span:first-child { color: #6b7280; }
    .row strong { color: #111; }
    .status-ok { color: #16a34a; font-weight: 600; }
    .status-pending { color: #d97706; font-weight: 600; }
    .note { font-size: 0.8rem; color: #6b7280; margin-top: 0.75rem; }
    .btns { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .btn { display: inline-block; padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; }
    .btn-primary { background: #d2002e; color: #fff; }
    .btn-primary:hover { background: #b10026; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .error { color: #dc2626; font-size: 0.9rem; margin-bottom: 1rem; }
    .loading { color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <h1>Сертификат оплачен</h1>
    <p class="sub">Спасибо за оплату. Сохраните чек.</p>
    <div id="receipt" class="receipt">
      <h2>Чек по сертификату</h2>
      <div id="rows"></div>
      <p class="note">Сохраните номер заказа для предъявления в клинике.</p>
    </div>
    <div id="err" class="error" style="display:none;"></div>
    <div class="btns">
      <button type="button" class="btn btn-secondary" onclick="window.print()">Распечатать чек</button>
      <a href="/certificates" class="btn btn-secondary">К сертификатам</a>
      <a href="/" class="btn btn-primary">На главную</a>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var orderId = params.get('orderId');
      var dateStr = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      var rowsEl = document.getElementById('rows');
      var errEl = document.getElementById('err');

      function addRow(label, value) {
        var row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<span>' + label + '</span><strong>' + (value || '—') + '</strong>';
        rowsEl.appendChild(row);
      }

      addRow('Номер заказа', orderId || '—');
      addRow('Дата и время', dateStr);
      addRow('Статус', '<span class="status-pending loading" id="statusRow">Проверка...</span>');

      if (!orderId) {
        document.getElementById('statusRow').innerHTML = '—';
        document.getElementById('statusRow').className = '';
        return;
      }

      var base = window.location.origin;
      fetch(base + '/certificate/check-payment/' + encodeURIComponent(orderId), { method: 'POST', headers: { 'Content-Type': 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var statusEl = document.getElementById('statusRow');
          if (data.orderStatus === 2) {
            statusEl.innerHTML = 'Оплачено';
            statusEl.className = 'status-ok';
          } else {
            statusEl.innerHTML = 'В обработке';
            statusEl.className = 'status-pending';
          }
          if (data.amount != null && data.amount > 0) {
            var amountRow = document.createElement('div');
            amountRow.className = 'row';
            amountRow.innerHTML = '<span>Сумма</span><strong>' + data.amount.toLocaleString('ru-RU') + ' ₽</strong>';
            rowsEl.insertBefore(amountRow, rowsEl.querySelector('.row:nth-child(2)'));
          }
        })
        .catch(function () {
          document.getElementById('statusRow').innerHTML = 'В обработке';
          document.getElementById('statusRow').className = 'status-pending';
        });
    })();
  </script>
</body>
</html>
